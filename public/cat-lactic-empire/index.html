  <body>
    <div id="app"></div>
    <div id="rotate-overlay">
      <div class="rotate-icon">&#128260;</div>
      <div>Rotate your device to play</div>
    </div>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      html, body { overscroll-behavior: none; }
      body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
      }
      canvas { image-rendering: pixelated; touch-action: none; }
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000814;
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        text-align: center;
        padding: 24px;
      }
      #rotate-overlay.show { display: flex; }
      #rotate-overlay .rotate-icon { font-size: 48px; animation: rotate-hint 1.6s ease-in-out infinite; }
      @keyframes rotate-hint {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }
    </style>
    <script>
      // Touch devices (iPhone/iPad, etc.) only -- the game is landscape-only
      // there since there's no keyboard and the whole layout assumes a wide
      // canvas. Desktop/mouse users are unaffected regardless of window shape.
      (function () {
        var isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window
        if (!isTouch) return
        var overlay = document.getElementById('rotate-overlay')
        function check() {
          var portrait = window.innerHeight > window.innerWidth
          overlay.classList.toggle('show', portrait)
        }
        check()
        window.addEventListener('resize', check)
        window.addEventListener('orientationchange', check)
      })()
    </script>
  </body>
